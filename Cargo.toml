[package]
name = "hackmd"
version = "0.1.0"
edition = "2024"
description = "Rust client library and CLI for HackMD"
license = "MIT"
repository = "https://github.com/zemse/hackmd"
readme = "README.md"
keywords = ["hackmd", "markdown", "cli", "tui", "api"]
categories = ["api-bindings", "command-line-utilities"]
include = [
    "/src/**/*.rs",
    "/README.md",
    "/LICENSE*",
]

[lib]
name = "hackmd"
path = "src/lib.rs"

[[bin]]
name = "hackmd"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli", "tui"]
cli = ["dep:open", "dep:crossterm"]
tui = [
    "cli",
    "dep:ratatui",
    "dep:crossterm",
    "dep:anyhow",
    "dep:pulldown-cmark",
    "dep:syntect",
    "dep:open",
    "dep:unicode-width",
    "dep:walkdir",
    "dep:ignore",
    "dep:ratatui-image",
    "dep:image",
    "dep:base64",
    "dep:toml",
    "dep:time",
    "dep:diffy",
]

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-std", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
serde_with = "3"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
tempfile = "3"
comfy-table = "7"
serde_yaml = "0.9"
ratatui = { version = "0.30", optional = true }
# `time` is only a transitive dep (via plist→syntect and ratatui-widgets). Pin below
# 0.3.48, whose `impl From<HourBase>` trips a rustc coherence false-positive against
# ratatui-widgets' blanket `impl<T: Into<Text>> From<T>`, breaking a non-locked
# `cargo install`. Lift once that interaction is resolved upstream.
time = { version = ">=0.3, <0.3.48", optional = true }
crossterm = { version = "0.29", optional = true }
anyhow = { version = "1", optional = true }
pulldown-cmark = { version = "0.13", default-features = false, optional = true }
syntect = { version = "5", default-features = false, features = ["default-fancy"], optional = true }
open = { version = "5", optional = true }
unicode-width = { version = "0.2", optional = true }
walkdir = { version = "2", optional = true }
ignore = { version = "0.4", optional = true }
ratatui-image = { version = "11", default-features = false, features = ["serde"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"], optional = true }
base64 = { version = "0.22", optional = true }
toml = { version = "1", optional = true }
# Three-way merge for local ↔ HackMD sync (git-style conflict detection).
diffy = { version = "0.4", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# System dictionary lookup (DCSCopyTextDefinition) for the in-TUI definition
# popover. Already present transitively via chrono → iana-time-zone on macOS;
# declared directly because `src/tui/dict.rs` calls into it. macOS-only.
core-foundation-sys = "0.8"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
assert_cmd = "2"
predicates = "3"
dotenvy = "0.15"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
