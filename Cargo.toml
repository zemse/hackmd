[package]
name = "hackmd"
version = "0.0.1"
edition = "2024"
description = "Rust client library and CLI for HackMD"
license = "MIT"
repository = "https://github.com/zemse/hackmd-rs"
readme = "README.md"
keywords = ["hackmd", "markdown", "cli", "tui", "api"]
categories = ["api-bindings", "command-line-utilities"]
include = [
    "/src/**/*.rs",
    "/README.md",
    "/LICENSE*",
]

[lib]
name = "hackmd"
path = "src/lib.rs"

[[bin]]
name = "hackmd"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = []
tui = ["cli"]

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
serde_with = "3"
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
tempfile = "3"
comfy-table = "7"
serde_yaml = "0.9"
rpassword = "7"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
assert_cmd = "2"
predicates = "3"
